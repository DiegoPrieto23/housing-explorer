[project]
name = "housing-explorer-backend"
version = "0.1.0"
description = "Normalised housing listings from pluggable sources"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
housing-explorer = "app.cli:main"

[project.optional-dependencies]
# Only needed to read the dataset as Parquet; CSV works with the stdlib alone.
parquet = ["pyarrow>=18.0"]

# Only needed to *run* the exported price model (app.pricing). Unpickling a
# scikit-learn estimator requires scikit-learn, and there is no way around that;
# it stays optional so the API image does not carry it until something serves
# predictions.
serving = ["scikit-learn>=1.5", "pandas>=2.2", "joblib>=1.4", "numpy>=1.26"]

# The analysis notebook and the price model. Deliberately out of the runtime
# dependencies: the API only needs to *load* the model, and pulling pandas,
# scikit-learn and matplotlib into the Docker image would multiply its size for
# code that never runs in production.
notebook = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
